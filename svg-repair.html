<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 修整台</title>
    <style>
      :root {
        --ink: #18231c;
        --paper: #f4f2ea;
        --side: #e8ece4;
        --line: #c7d0c5;
        --green: #4f9b78;
        --red: #a7473c;
        --muted: #637168;
        --panel: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 1080px;
        color: var(--ink);
        background: var(--paper);
        font:
          14px/1.42 Georgia,
          'Noto Serif SC',
          'Songti SC',
          serif;
      }
      .app {
        height: 100vh;
        display: grid;
        grid-template-columns: 350px minmax(0, 1fr);
        overflow: hidden;
      }
      aside {
        padding: 22px 18px;
        overflow: auto;
        background: var(--side);
        border-right: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding-bottom: 17px;
        border-bottom: 2px solid var(--ink);
      }
      .brand b {
        font-size: 25px;
        letter-spacing: 1px;
      }
      .brand small {
        color: var(--muted);
        letter-spacing: 0.6px;
      }
      section {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      h2 {
        margin: 0 0 9px;
        font-size: 13px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }
      p,
      .hint {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      label + label {
        margin-top: 8px;
      }
      input[type='file'],
      select,
      input[type='number'],
      input[type='text'] {
        width: 100%;
        margin-top: 4px;
      }
      select,
      input[type='number'],
      input[type='text'] {
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: #fff;
        color: var(--ink);
      }
      input[type='color'] {
        width: 38px;
        height: 34px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: white;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--green);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
      }
      .row > * {
        min-width: 0;
      }
      .row select {
        margin: 0;
        flex: 1;
      }
      button {
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid var(--ink);
        border-radius: 3px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        color: white;
        background: var(--ink);
      }
      button.primary {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      button.primary:hover {
        background: #397e5d;
      }
      button.danger {
        color: var(--red);
        border-color: var(--red);
      }
      button.danger:hover {
        background: var(--red);
        color: white;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }
      main {
        min-width: 0;
        display: grid;
        grid-template-rows: 68px minmax(0, 1fr);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 27px;
        background: rgba(255, 255, 255, 0.75);
        border-bottom: 1px solid var(--line);
      }
      .toolbar .actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #status {
        color: var(--muted);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #zoomLabel {
        min-width: 40px;
        color: var(--muted);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .stage-wrap {
        min-height: 0;
        padding: 27px;
      }
      #stage {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid #d6ddd4;
        cursor: grab;
        touch-action: none;
        background-color: #e2e6df;
        background-image:
          linear-gradient(45deg, #d3d9d1 25%, transparent 25%),
          linear-gradient(-45deg, #d3d9d1 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #d3d9d1 75%),
          linear-gradient(-45deg, transparent 75%, #d3d9d1 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
      }
      #stage[data-pan] {
        cursor: grabbing;
      }
      #preview {
        width: min(74vw, 780px);
        height: min(74vh, 780px);
        transform-origin: center center;
        will-change: transform;
        filter: drop-shadow(0 13px 18px rgba(25, 36, 29, 0.17));
      }
      #preview svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        font-style: italic;
      }
      .palette {
        display: grid;
        gap: 5px;
        max-height: 142px;
        overflow: auto;
      }
      .chip {
        display: grid;
        grid-template-columns: 20px 1fr auto;
        align-items: center;
        gap: 7px;
        padding: 4px;
        border-radius: 3px;
        font:
          11px/1 Consolas,
          monospace;
      }
      .chip:hover {
        background: #f9faf7;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(0, 0, 0, 0.22);
        border-radius: 2px;
      }
      .count {
        color: var(--muted);
        font-family: Georgia, 'Noto Serif SC', serif;
      }
      .layer-list {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .layer {
        display: grid;
        grid-template-columns: 40px 1fr auto auto;
        gap: 5px;
        align-items: center;
        min-height: 31px;
        padding: 4px 5px;
        border-bottom: 1px solid #eef1eb;
        font:
          11px/1.15 Consolas,
          monospace;
      }
      .layer:last-child {
        border: 0;
      }
      .layer[data-selected='true'] {
        background: #dbece2;
      }
      .layer button {
        min-height: 23px;
        padding: 2px 5px;
        border: 0;
        font: inherit;
      }
      .layer button:hover {
        background: #e2e8e2;
        color: var(--ink);
      }
      .layer .remove {
        color: var(--red);
      }
      .layer .remove:hover {
        background: #f6dfdb;
        color: var(--red);
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }
      kbd {
        padding: 1px 4px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: #fff;
        font:
          10px Consolas,
          monospace;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <b>SVG 修整台</b><small>LOCAL VECTOR TOOL</small>
        </div>
        <section>
          <h2>文件</h2>
          <input id="file" type="file" accept="image/svg+xml,.svg" />
          <p>
            文件只在当前浏览器内处理。输出不会包含脚本、嵌入对象或事件属性。
          </p>
        </section>
        <section>
          <h2>颜色与镂空</h2>
          <p>
            支持 <code>#4F9B78</code>、<code>rgb(79, 155, 120)</code> 和
            <code>rgba(...)</code>；设为 <code>none</code> 可形成透明镂空。
          </p>
          <div class="row">
            <select id="paint">
              <option value="fill">填充 fill</option>
              <option value="stroke">描边 stroke</option></select
            ><select id="source"></select>
          </div>
          <label
            >目标颜色（CSS / RGB）<input
              id="targetText"
              type="text"
              value="#4f9b78"
              placeholder="rgb(79, 155, 120)"
          /></label>
          <div class="row">
            <input
              id="target"
              type="color"
              value="#4f9b78"
              title="颜色选择器会同步到目标颜色"
            /><button id="replace">替换</button
            ><button id="clearPaint" class="danger">镂空</button>
          </div>
          <div class="row">
            <button id="clearRgbWhite" class="danger">
              RGB 白色形状裁成透明
            </button>
          </div>
          <div id="palette" class="palette"></div>
        </section>
        <section>
          <h2>自动清理</h2>
          <p>建议先用较小阈值试一次，再使用撤销逐步加大。</p>
          <label
            >删除短路径（d 字符数）<input
              id="shortLimit"
              type="number"
              min="0"
              value="120"
          /></label>
          <div class="row">
            <button id="removeShort" class="danger">删除短路径</button
            ><span id="shortInfo" class="count"></span>
          </div>
          <label style="margin-top: 10px"
            >删除细描边（stroke-width）<input
              id="thinLimit"
              type="number"
              min="0"
              step=".1"
              value="1"
          /></label>
          <div class="row">
            <button id="removeThin" class="danger">删除细描边</button
            ><span id="thinInfo" class="count"></span>
          </div>
          <div class="row">
            <button id="removeDuplicates" class="danger">清除完全重复</button
            ><button id="roundNumbers">坐标取整</button>
          </div>
        </section>
        <section>
          <h2>选中图层</h2>
          <p>从图层清单选中一个元素后，这里的颜色只修改该元素。</p>
          <div class="row">
            <select id="selectedPaint">
              <option value="fill">填充 fill</option>
              <option value="stroke">描边 stroke</option></select
            ><input
              id="selectedColor"
              type="text"
              placeholder="rgb(79, 155, 120)"
              disabled
            />
          </div>
          <div class="row">
            <button id="applySelectedColor" disabled>应用图层颜色</button
            ><button id="clearSelectedColor" class="danger" disabled>
              清除图层颜色
            </button>
          </div>
          <div class="twocol" style="margin-top: 10px">
            <button id="toggleVisibility">隐藏 / 显示</button
            ><button id="front">置于最前</button
            ><button id="back">置于最后</button
            ><button id="deleteSelected" class="danger">删除图层</button>
          </div>
          <label style="margin-top: 10px"
            >不透明度 <span id="opacityLabel">100%</span
            ><input id="opacity" type="range" min="0" max="100" value="100"
          /></label>
        </section>
        <section>
          <h2>图层清单</h2>
          <p>点击编号将高亮对应图形；“删”只删除单一元素。</p>
          <div id="layers" class="layer-list"></div>
        </section>
        <section>
          <div class="stat">
            <span>快捷键</span
            ><span
              ><kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销 · <kbd>Del</kbd> 删除</span
            >
          </div>
        </section>
      </aside>
      <main>
        <div class="toolbar">
          <span id="status">选择 SVG 文件开始修整</span>
          <div class="actions">
            <button id="zoomOut" title="缩小">-</button
            ><span id="zoomLabel">100%</span
            ><button id="zoomIn" title="放大">+</button
            ><button id="fit">适合画布</button
            ><button id="undo" disabled>撤销</button
            ><button id="reset" disabled>还原</button
            ><button id="download" class="primary" disabled>下载 SVG</button>
          </div>
        </div>
        <div class="stage-wrap">
          <div id="stage">
            <div id="preview" class="empty">
              载入 SVG 后在此预览<br />左键拖动，滚轮缩放
            </div>
          </div>
        </div>
      </main>
    </div>
    <script>
      (() => {
        const $ = (s) => document.querySelector(s);
        const el = {
          file: $('#file'),
          paint: $('#paint'),
          source: $('#source'),
          target: $('#target'),
          targetText: $('#targetText'),
          replace: $('#replace'),
          clearPaint: $('#clearPaint'),
          clearRgbWhite: $('#clearRgbWhite'),
          palette: $('#palette'),
          shortLimit: $('#shortLimit'),
          thinLimit: $('#thinLimit'),
          removeShort: $('#removeShort'),
          removeThin: $('#removeThin'),
          removeDuplicates: $('#removeDuplicates'),
          roundNumbers: $('#roundNumbers'),
          shortInfo: $('#shortInfo'),
          thinInfo: $('#thinInfo'),
          layers: $('#layers'),
          selectedPaint: $('#selectedPaint'),
          selectedColor: $('#selectedColor'),
          applySelectedColor: $('#applySelectedColor'),
          clearSelectedColor: $('#clearSelectedColor'),
          opacity: $('#opacity'),
          opacityLabel: $('#opacityLabel'),
          toggleVisibility: $('#toggleVisibility'),
          front: $('#front'),
          back: $('#back'),
          deleteSelected: $('#deleteSelected'),
          stage: $('#stage'),
          preview: $('#preview'),
          status: $('#status'),
          zoomOut: $('#zoomOut'),
          zoomIn: $('#zoomIn'),
          zoomLabel: $('#zoomLabel'),
          fit: $('#fit'),
          undo: $('#undo'),
          reset: $('#reset'),
          download: $('#download'),
        };
        let original = '',
          current = '',
          history = [],
          selected = null,
          fileName = 'repaired.svg',
          view = { scale: 1, x: 0, y: 0 },
          drag = null;
        const graphicSelector =
          'path,rect,circle,ellipse,polygon,polyline,line,use';
        const norm = (v) =>
          String(v || '')
            .trim()
            .toLowerCase();
        const doc = () =>
          new DOMParser().parseFromString(current, 'image/svg+xml');
        const serialize = (d) => {
          current = new XMLSerializer().serializeToString(d.documentElement);
          render();
        };
        const graphics = (d = doc()) =>
          [...d.querySelectorAll(graphicSelector)].filter(
            (n) => !n.closest('defs')
          );
        const paths = (d = doc()) => [...d.querySelectorAll('path')];
        function sanitize(text) {
          const d = new DOMParser().parseFromString(text, 'image/svg+xml');
          if (
            d.querySelector('parsererror') ||
            d.documentElement?.nodeName.toLowerCase() !== 'svg'
          )
            throw new Error('文件不是有效 SVG');
          d.querySelectorAll(
            'script,foreignObject,iframe,object,embed,audio,video'
          ).forEach((n) => n.remove());
          d.querySelectorAll('*').forEach((n) =>
            [...n.attributes].forEach((a) => {
              if (
                /^on/i.test(a.name) ||
                /^(?:javascript:|data:text\/html)/i.test(a.value.trim())
              )
                n.removeAttribute(a.name);
            })
          );
          d.documentElement.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          return new XMLSerializer().serializeToString(d.documentElement);
        }
        function save() {
          history.push(current);
          if (history.length > 50) history.shift();
          el.undo.disabled = false;
        }
        function edit(fn, keepSelection = false) {
          if (!current) return;
          save();
          const d = doc();
          fn(d);
          if (!keepSelection) selected = null;
          serialize(d);
        }
        function isColor(value) {
          return (
            Boolean(value) &&
            value !== 'none' &&
            !value.startsWith('url(') &&
            CSS.supports('color', value)
          );
        }
        function isRgbWhite(value) {
          const rgb = norm(value);
          return (
            /^rgb\(\s*255\s*(?:,|\s)\s*255\s*(?:,|\s)\s*255\s*\)$/i.test(rgb) ||
            /^rgba\(\s*255\s*,\s*255\s*,\s*255\s*,\s*1(?:\.0+)?\s*\)$/i.test(
              rgb
            )
          );
        }
        function cutRgbWhite(d) {
          const svg = d.documentElement,
            NS = 'http://www.w3.org/2000/svg',
            white = graphics(d).filter((n) =>
              isRgbWhite(n.getAttribute('fill'))
            );
          if (!white.length) return 0;
          let defs = [...svg.children].find((n) => n.localName === 'defs');
          if (!defs) {
            defs = d.createElementNS(NS, 'defs');
            svg.insertBefore(defs, svg.firstChild);
          }
          const content = d.createElementNS(NS, 'g');
          content.setAttribute('data-repair-cutout-content', 'true');
          [...svg.children]
            .filter(
              (n) =>
                n !== defs &&
                !['title', 'desc', 'metadata'].includes(n.localName)
            )
            .forEach((n) => content.appendChild(n));
          const mask = d.createElementNS(NS, 'mask'),
            maskId = `repair-white-cutout-${Date.now()}`;
          mask.setAttribute('id', maskId);
          mask.setAttribute('data-repair-white-cutout', 'true');
          const base = d.createElementNS(NS, 'rect');
          base.setAttribute('width', '100%');
          base.setAttribute('height', '100%');
          base.setAttribute('fill', '#fff');
          mask.appendChild(base);
          const silhouette = content.cloneNode(true);
          silhouette.querySelectorAll(graphicSelector).forEach((n) => {
            if (isRgbWhite(n.getAttribute('fill'))) {
              n.setAttribute(
                'style',
                'fill:#000!important;stroke:none!important;opacity:1!important;fill-opacity:1!important;'
              );
            } else n.setAttribute('display', 'none');
          });
          mask.appendChild(silhouette);
          defs.appendChild(mask);
          content.setAttribute('mask', `url(#${maskId})`);
          svg.appendChild(content);
          return white.length;
        }
        function colors(kind) {
          const map = new Map();
          graphics().forEach((n) => {
            const c = norm(n.getAttribute(kind));
            if (isColor(c)) map.set(c, (map.get(c) || 0) + 1);
          });
          return [...map].sort((a, b) => b[1] - a[1]);
        }
        function updateView() {
          el.preview.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
          el.zoomLabel.textContent = `${Math.round(view.scale * 100)}%`;
        }
        function fit() {
          view = { scale: 1, x: 0, y: 0 };
          updateView();
        }
        function zoom(factor, x, y) {
          const next = Math.max(0.1, Math.min(8, view.scale * factor));
          if (next === view.scale) return;
          const r = el.stage.getBoundingClientRect(),
            cx = x ?? r.left + r.width / 2,
            cy = y ?? r.top + r.height / 2,
            ox = cx - r.left - r.width / 2,
            oy = cy - r.top - r.height / 2;
          view.x = ox - (ox - view.x) * (next / view.scale);
          view.y = oy - (oy - view.y) * (next / view.scale);
          view.scale = next;
          updateView();
        }
        function render() {
          if (!current) return;
          const display = doc(),
            nodes = graphics(display);
          if (selected !== null && nodes[selected]) {
            const n = nodes[selected],
              s = n.getAttribute('style') || '';
            n.setAttribute(
              'style',
              `${s};stroke:#e34a3d!important;stroke-width:5!important;vector-effect:non-scaling-stroke!important;`
            );
          }
          el.preview.classList.remove('empty');
          el.preview.innerHTML = new XMLSerializer().serializeToString(
            display.documentElement
          );
          const kind = el.paint.value,
            entries = colors(kind),
            old = el.source.value;
          el.source.innerHTML = entries.length
            ? entries
                .map(
                  ([c, n]) =>
                    `<option value="${c}">${c.toUpperCase()} (${n})</option>`
                )
                .join('')
            : '<option value="">没有可替换颜色</option>';
          if (entries.some(([c]) => c === old)) el.source.value = old;
          el.palette.innerHTML = entries
            .map(
              ([c, n]) =>
                `<div class="chip"><i class="swatch" style="background:${c}"></i><span>${c.toUpperCase()}</span><span class="count">${n}</span></div>`
            )
            .join('');
          const live = graphics(),
            short = paths().filter(
              (n) =>
                (n.getAttribute('d') || '').length <
                Number(el.shortLimit.value || 0)
            ).length,
            thin = live.filter(
              (n) =>
                n.hasAttribute('stroke') &&
                parseFloat(n.getAttribute('stroke-width') || 1) <=
                  Number(el.thinLimit.value || 0)
            ).length;
          el.shortInfo.textContent = `${short} 条`;
          el.thinInfo.textContent = `${thin} 条`;
          el.layers.innerHTML =
            live
              .map((n, i) => {
                const id = n.id
                    ? `#${n.id}`
                    : `${n.tagName.toLowerCase()} ${i + 1}`,
                  fill = norm(n.getAttribute('fill')) || '-',
                  size = (n.getAttribute('d') || n.outerHTML).length;
                return `<div class="layer" data-index="${i}" data-selected="${selected === i}"><button class="pick" title="高亮图层">${i + 1}</button><span title="${id} · ${fill} · ${size}">${id} · ${fill} · ${size}</span><button class="eye" title="切换显示">${n.getAttribute('display') === 'none' ? '显' : '隐'}</button><button class="remove" title="删除图层">删</button></div>`;
              })
              .join('') ||
            '<p class="hint" style="padding:8px">没有可编辑图形</p>';
          const n = selected === null ? null : live[selected];
          const opacity = n
            ? Math.round(parseFloat(n.getAttribute('opacity') || 1) * 100)
            : 100;
          el.opacity.value = opacity;
          el.opacityLabel.textContent = `${opacity}%`;
          el.selectedColor.disabled = !n;
          el.applySelectedColor.disabled = !n;
          el.clearSelectedColor.disabled = !n;
          if (n)
            el.selectedColor.value =
              n.getAttribute(el.selectedPaint.value) || '';
          else el.selectedColor.value = '';
          el.status.textContent = `${fileName} · ${live.length} 个图形元素 · ${entries.length} 种${kind === 'fill' ? '填充' : '描边'}色`;
          el.undo.disabled = !history.length;
          el.reset.disabled = false;
          el.download.disabled = false;
          updateView();
        }
        function selectedNode(d) {
          return selected === null ? null : graphics(d)[selected] || null;
        }
        el.file.addEventListener('change', async () => {
          const f = el.file.files[0];
          if (!f) return;
          try {
            original = sanitize(await f.text());
            current = original;
            history = [];
            selected = null;
            fileName = f.name.replace(/\.svg$/i, '') + '-repaired.svg';
            render();
            fit();
          } catch (e) {
            el.status.textContent = `载入失败：${e.message}`;
          }
        });
        el.paint.addEventListener('change', render);
        [el.shortLimit, el.thinLimit].forEach((i) =>
          i.addEventListener('input', () => current && render())
        );
        el.target.addEventListener('input', () => {
          el.targetText.value = el.target.value;
        });
        el.selectedPaint.addEventListener('change', () => current && render());
        el.replace.addEventListener('click', () => {
          const from = el.source.value,
            to = el.targetText.value.trim();
          if (!from) return;
          if (!isColor(to)) {
            el.status.textContent =
              '目标颜色无效，请输入 #4F9B78、rgb(...) 或 rgba(...)';
            return;
          }
          edit((d) =>
            graphics(d).forEach((n) => {
              if (norm(n.getAttribute(el.paint.value)) === from)
                n.setAttribute(el.paint.value, to);
            })
          );
        });
        el.clearPaint.addEventListener('click', () => {
          const from = el.source.value;
          if (!from) return;
          edit((d) =>
            graphics(d).forEach((n) => {
              if (norm(n.getAttribute(el.paint.value)) === from)
                n.setAttribute(el.paint.value, 'none');
            })
          );
        });
        el.clearRgbWhite.addEventListener('click', () => {
          if (!current) return;
          const before = doc();
          if (before.querySelector('mask[data-repair-white-cutout]')) {
            el.status.textContent =
              '当前 SVG 已应用 RGB 白色裁透明；请先还原或重新载入后再执行。';
            return;
          }
          const count = graphics(before).filter((n) =>
            isRgbWhite(n.getAttribute('fill'))
          ).length;
          if (!count) {
            el.status.textContent = '未找到 rgb(255,255,255) 白色填充。';
            return;
          }
          edit((d) => cutRgbWhite(d));
          el.status.textContent = `已按 ${count} 个 RGB 白色形状裁出透明区域。`;
        });
        el.removeShort.addEventListener('click', () =>
          edit((d) =>
            paths(d)
              .filter(
                (n) =>
                  (n.getAttribute('d') || '').length <
                  Number(el.shortLimit.value || 0)
              )
              .forEach((n) => n.remove())
          )
        );
        el.removeThin.addEventListener('click', () =>
          edit((d) =>
            graphics(d)
              .filter(
                (n) =>
                  n.hasAttribute('stroke') &&
                  parseFloat(n.getAttribute('stroke-width') || 1) <=
                    Number(el.thinLimit.value || 0)
              )
              .forEach((n) => n.remove())
          )
        );
        el.removeDuplicates.addEventListener('click', () =>
          edit((d) => {
            const seen = new Set();
            graphics(d).forEach((n) => {
              const key = n.outerHTML.replace(/\s+/g, ' ');
              if (seen.has(key)) n.remove();
              else seen.add(key);
            });
          })
        );
        el.roundNumbers.addEventListener('click', () =>
          edit((d) =>
            paths(d).forEach((n) => {
              const value = n.getAttribute('d');
              if (value)
                n.setAttribute(
                  'd',
                  value.replace(/-?\d*\.\d+/g, (m) =>
                    String(Math.round(Number(m) * 100) / 100)
                  )
                );
            })
          )
        );
        el.layers.addEventListener('click', (e) => {
          const row = e.target.closest('.layer');
          if (!row) return;
          const index = Number(row.dataset.index);
          if (e.target.classList.contains('remove')) {
            edit((d) => graphics(d)[index]?.remove());
            return;
          }
          if (e.target.classList.contains('eye')) {
            edit((d) => {
              const n = graphics(d)[index];
              if (n)
                n.getAttribute('display') === 'none'
                  ? n.removeAttribute('display')
                  : n.setAttribute('display', 'none');
            });
            return;
          }
          selected = selected === index ? null : index;
          render();
        });
        el.deleteSelected.addEventListener('click', () => {
          if (selected === null) return;
          edit((d) => selectedNode(d)?.remove());
        });
        el.applySelectedColor.addEventListener('click', () => {
          const value = el.selectedColor.value.trim();
          if (selected === null || !isColor(value)) {
            el.status.textContent =
              '图层颜色无效，请输入 #4F9B78、rgb(...) 或 rgba(...)';
            return;
          }
          edit((d) => {
            const n = selectedNode(d);
            if (n) n.setAttribute(el.selectedPaint.value, value);
          }, true);
        });
        el.clearSelectedColor.addEventListener('click', () => {
          if (selected === null) return;
          edit((d) => {
            const n = selectedNode(d);
            if (n) n.setAttribute(el.selectedPaint.value, 'none');
          }, true);
        });
        el.toggleVisibility.addEventListener('click', () => {
          if (selected === null) return;
          edit((d) => {
            const n = selectedNode(d);
            if (n)
              n.getAttribute('display') === 'none'
                ? n.removeAttribute('display')
                : n.setAttribute('display', 'none');
          });
        });
        el.front.addEventListener('click', () => {
          if (selected === null) return;
          edit((d) => {
            const n = selectedNode(d);
            if (n) n.parentNode.appendChild(n);
          });
        });
        el.back.addEventListener('click', () => {
          if (selected === null) return;
          edit((d) => {
            const n = selectedNode(d);
            if (n) n.parentNode.insertBefore(n, n.parentNode.firstChild);
          });
        });
        el.opacity.addEventListener('input', () => {
          el.opacityLabel.textContent = `${el.opacity.value}%`;
        });
        el.opacity.addEventListener('change', () => {
          if (selected === null) return;
          const value = Number(el.opacity.value) / 100;
          edit((d) => {
            const n = selectedNode(d);
            if (n) n.setAttribute('opacity', value);
          });
        });
        el.undo.addEventListener('click', () => {
          if (!history.length) return;
          current = history.pop();
          selected = null;
          render();
        });
        el.reset.addEventListener('click', () => {
          if (!original) return;
          save();
          current = original;
          selected = null;
          render();
          fit();
        });
        el.download.addEventListener('click', () => {
          const url = URL.createObjectURL(
              new Blob([current], { type: 'image/svg+xml;charset=utf-8' })
            ),
            a = Object.assign(document.createElement('a'), {
              href: url,
              download: fileName,
            });
          a.click();
          URL.revokeObjectURL(url);
        });
        el.zoomIn.addEventListener('click', () => zoom(1.2));
        el.zoomOut.addEventListener('click', () => zoom(1 / 1.2));
        el.fit.addEventListener('click', fit);
        el.stage.addEventListener(
          'wheel',
          (e) => {
            if (!current) return;
            e.preventDefault();
            zoom(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
          },
          { passive: false }
        );
        el.stage.addEventListener('pointerdown', (e) => {
          if (!current || e.button !== 0) return;
          drag = { x: e.clientX, y: e.clientY, ox: view.x, oy: view.y };
          el.stage.dataset.pan = 'true';
          el.stage.setPointerCapture(e.pointerId);
        });
        el.stage.addEventListener('pointermove', (e) => {
          if (!drag) return;
          view.x = drag.ox + e.clientX - drag.x;
          view.y = drag.oy + e.clientY - drag.y;
          updateView();
        });
        const stop = () => {
          drag = null;
          delete el.stage.dataset.pan;
        };
        el.stage.addEventListener('pointerup', stop);
        el.stage.addEventListener('pointercancel', stop);
        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            el.undo.click();
          }
          if (e.key === 'Delete' && selected !== null)
            el.deleteSelected.click();
        });
      })();
    </script>
  </body>
</html>
