<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防循环嵌套：工作台只能在顶层窗口运行；
         若被误当作普通页面塞进 iframe（例如某静态页缺失、dev 服务器回退到本页），
         立即跳出，避免工作台无限自我嵌套 -->
    <script>
      if (window.self !== window.top) {
        try {
          window.top.location.replace(window.location.href);
        } catch (e) {
          window.location.replace('about:blank');
        }
      }
    </script>

    <!-- Primary Meta Tags -->
    <title>TuHe PDF - 图合 · 浏览器端 PDF 工作台</title>
    <meta name="title" content="TuHe PDF - 图合 · 浏览器端 PDF 工作台" />
    <meta
      name="description"
      content="TuHe PDF（图合）- 纯浏览器端 PDF 工具台：合并、拆分、压缩、转换 PDF，文件不出本机，免注册，无限制。"
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="TuHe PDF" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <link href="src/css/styles.css" rel="stylesheet" />
  </head>

  <body class="antialiased">
    <!-- ===== 全局唯一顶部导航 ===== -->
    <header class="wb-topbar">
      <button
        id="topbar-brand"
        class="wb-topbar-brand"
        type="button"
        title="TuHe PDF 首页"
      >
        <img
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="图合 PDF 标志"
        />
        <span class="wb-topbar-brand-name">TuHe PDF</span>
        <span class="wb-topbar-version">v{{appVersion}}</span>
      </button>
      <nav class="wb-topbar-nav">
        <a
          href="about.html"
          data-page-tab="about"
          data-page-title="关于我们"
          data-page-icon="ph-info"
          data-i18n="nav.about"
          >关于我们</a
        >
        <a
          href="contact.html"
          data-page-tab="contact"
          data-page-title="联系我们"
          data-page-icon="ph-envelope-simple"
          data-i18n="nav.contact"
          >联系我们</a
        >
        <a
          href="licensing.html"
          data-page-tab="licensing"
          data-page-title="许可"
          data-page-icon="ph-certificate"
          data-i18n="nav.licensing"
          >许可</a
        >
        <a
          href="https://www.tuhepdf.cn/docs/"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="nav.docs"
          >文档</a
        >
        <div id="topbar-lang-switcher" class="flex items-center ml-1"></div>
      </nav>
    </header>

    <div id="workbench">
      <!-- ===== 左侧卡片栏 ===== -->
      <aside id="tool-rail" aria-label="工具卡片栏">
        <div class="rail-top">
          <div class="rail-search-wrap">
            <i data-lucide="search"></i>
            <input
              type="text"
              id="rail-search-input"
              data-i18n-placeholder="tools.searchPlaceholder"
              placeholder="搜索工具… (Ctrl+K)"
              autocomplete="off"
            />
          </div>
          <button
            id="rail-toggle"
            class="rail-toggle"
            type="button"
            title="展开 / 收起卡片栏"
            aria-label="展开或收起卡片栏"
            data-i18n-title="workbench.toggleRail"
          >
            <i data-lucide="panel-left-open" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="rail-scroll" class="rail-scroll">
          <div id="rail-categories"></div>
        </div>

        <div class="rail-foot">
          <!-- 预留：未来账号登录后在此显示账号信息 -->
          <div id="rail-account" class="rail-account"></div>
        </div>
      </aside>

      <div id="rail-backdrop"></div>

      <!-- ===== 右侧工作区 ===== -->
      <main id="workspace">
        <div id="tab-bar" role="tablist">
          <div id="tab-list" class="flex items-end gap-1"></div>
        </div>

        <div id="workspace-body">
          <!-- TuHe 默认首页：没有打开任何工具标签页时显示 -->
          <section id="tuhe-home">
            <div class="tuhe-home-inner">
              <div class="tuhe-logo-badge">
                <img
                  src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
                  alt="图合 PDF"
                />
              </div>
              <h1 class="tuhe-title">
                TuHe <span class="tuhe-title-cn">图合</span> PDF
              </h1>
              <p class="tuhe-subtitle" data-i18n="workbench.homeSubtitle">
                纯浏览器端的 PDF 工作台 · 合并、拆分、压缩、转换 ·
                文件全程不出本机
              </p>

              <p class="tuhe-quick-title" data-i18n="workbench.quickTools">
                常用工具
              </p>
              <div class="tuhe-quick-grid">
                <button class="tuhe-quick-card" data-open-tool="merge-pdf">
                  <i class="ph ph-browsers"></i>
                  <span data-i18n="tools:mergePdf.name">合并 PDF</span>
                </button>
                <button class="tuhe-quick-card" data-open-tool="split-pdf">
                  <i class="ph ph-scissors"></i>
                  <span data-i18n="tools:splitPdf.name">拆分 PDF</span>
                </button>
                <button class="tuhe-quick-card" data-open-tool="compress-pdf">
                  <i class="ph ph-lightning"></i>
                  <span data-i18n="tools:compressPdf.name">压缩 PDF</span>
                </button>
                <button class="tuhe-quick-card" data-open-tool="jpg-to-pdf">
                  <i class="ph ph-file-jpg"></i>
                  <span data-i18n="tools:jpgToPdf.name">JPG 转 PDF</span>
                </button>
                <button class="tuhe-quick-card" data-open-tool="edit-pdf">
                  <i class="ph ph-pencil-simple"></i>
                  <span data-i18n="tools:pdfEditor.name">PDF 编辑器</span>
                </button>
                <button class="tuhe-quick-card" data-open-tool="sign-pdf">
                  <i class="ph ph-pen-nib"></i>
                  <span data-i18n="tools:signPdf.name">签署 PDF</span>
                </button>
              </div>

              <p class="tuhe-hint">
                <i class="ph ph-arrow-left"></i>
                <span data-i18n="workbench.homeHint"
                  >从左侧卡片栏选择任意工具开始，工具会在右侧标签页中打开</span
                >
              </p>
            </div>
          </section>

          <!-- 工具标签页面板容器（iframe 由 workbench.ts 动态创建） -->
          <div id="tab-panels"></div>
        </div>
      </main>
    </div>

    <!-- 移动端打开卡片栏的悬浮按钮 -->
    <button
      id="mobile-rail-btn"
      type="button"
      aria-label="打开工具卡片栏"
      data-i18n-title="workbench.openToolRail"
    >
      <i data-lucide="layout-grid" class="w-5 h-5"></i>
    </button>

    <div
      id="loader-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50"
    >
      <div
        class="bg-gray-800 p-8 rounded-lg flex flex-col items-center gap-4 border border-gray-700 shadow-xl"
      >
        <div class="solid-spinner"></div>
        <p
          id="loader-text"
          class="text-white text-lg font-medium"
          data-i18n="loader.processing"
        >
          Processing...
        </p>
      </div>
    </div>

    <div
      id="alert-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-gray-800 max-w-sm w-full p-6 rounded-lg border border-gray-700 shadow-xl text-center"
      >
        <h3
          id="alert-title"
          class="text-xl font-bold text-white mb-2"
          data-i18n="alert.title"
        >
          Alert
        </h3>
        <p
          id="alert-message"
          class="text-gray-300 mb-6 whitespace-pre-line"
          data-i18n="alert.message"
        >
          This is an alert message.
        </p>
        <button
          id="alert-ok"
          class="btn bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-indigo-700"
          data-i18n="alert.ok"
        >
          OK
        </button>
      </div>
    </div>

    <div
      id="preview-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-40 p-4"
    >
      <div
        class="bg-white text-black rounded-lg shadow-xl w-full max-w-4xl h-[90vh] flex flex-col"
      >
        <div class="p-4 border-b flex justify-between items-center">
          <h3 class="text-xl font-bold" data-i18n="preview.title">
            Document Preview
          </h3>
          <div class="flex gap-4">
            <button
              id="preview-download-btn"
              class="btn bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-indigo-700"
              data-i18n="preview.download"
            >
              Download as PDF
            </button>
            <button
              id="preview-close-btn"
              class="btn bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-gray-700"
              data-i18n="preview.close"
            >
              Close
            </button>
          </div>
        </div>
        <div id="preview-content" class="p-8 overflow-y-auto flex-grow"></div>
      </div>
    </div>

    <!-- Shortcuts Modal -->
    {{> settings-modal }}

    <!-- Warning Modal -->
    {{> warning-modal }}

    <div id="signature-ghost" class="hidden"></div>

    <script type="module" src="src/js/utils/lucide-init.ts"></script>
    <script type="module" src="src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="src/js/main.ts"></script>
    <script type="module" src="src/js/sw-register.ts"></script>
  </body>
</html>
