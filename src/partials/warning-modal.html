<!-- Warning Modal -->
<div
  id="warning-modal"
  class="fixed inset-0 wb-modal-backdrop z-50 hidden items-center justify-center p-4"
>
  <div class="wb-modal-card max-w-md w-full overflow-hidden animate-scale-in">
    <div class="p-6">
      <div class="flex items-start gap-4 mb-4">
        <div
          id="warning-icon"
          class="ui-warning-icon w-12 h-12 flex items-center justify-center rounded-full flex-shrink-0"
        >
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <div class="flex-1">
          <h3
            id="warning-title"
            class="text-xl font-bold ui-text-primary mb-2"
            data-i18n="warning.title"
          >
            Warning
          </h3>
          <p
            id="warning-message"
            class="ui-text-secondary text-sm leading-relaxed"
          ></p>
        </div>
      </div>
    </div>
    <div class="ui-modal-footer flex gap-3 p-4 border-t">
      <button
        id="warning-cancel-btn"
        class="ui-button-secondary ui-focus-ring flex-1 px-4 py-2.5 font-medium"
        data-i18n="warning.cancel"
      >
        Cancel
      </button>
      <button
        id="warning-confirm-btn"
        class="ui-button-danger ui-focus-ring flex-1 px-4 py-2.5 font-medium"
        data-i18n="warning.proceed"
      >
        Proceed
      </button>
    </div>
  </div>
</div>
