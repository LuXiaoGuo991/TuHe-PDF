<footer class="mt-16 border-t-2 border-gray-700 py-8" data-simple-footer="true">
  <div class="container mx-auto px-4 text-center">
    <div class="flex flex-col items-center gap-4">
      <div class="flex items-center">
        {{#if brandLogo}}
        <img
          id="footer-logo"
          src="{{baseUrl}}{{brandLogo}}"
          alt="TuHe PDF Logo"
          class="mr-2 h-8 w-8"
        />
        {{else}}
        <img
          src="{{baseUrl}}images/tuhe-logo-light.svg"
          alt="TuHe PDF Logo"
          class="theme-logo theme-logo--light mr-2 h-8 w-8"
        />
        <img
          id="footer-logo"
          src="{{baseUrl}}images/tuhe-logo-dark.svg"
          alt="TuHe PDF Logo"
          class="theme-logo theme-logo--dark mr-2 h-8 w-8"
        />
        {{/if}}
        <span id="footer-brand" class="text-lg font-bold text-white"
          >TuHe PDF</span
        >
      </div>
      <p class="text-sm text-gray-400">
        图合PDF工具（TuHe PDF），由个人开发者运营
      </p>
      <div
        class="flex flex-wrap justify-center gap-x-4 gap-y-2 text-sm text-gray-400"
      >
        <a href="about.html" class="ui-hover-text-action">关于</a>
        <a href="contact.html" class="ui-hover-text-action">联系与投诉</a>
        <a href="terms.html" class="ui-hover-text-action">服务条款</a>
        <a href="privacy.html" class="ui-hover-text-action">隐私政策</a>
      </div>
      <div
        class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-xs text-gray-500"
      >
        <a
          href="https://beian.miit.gov.cn/"
          target="_blank"
          rel="noopener noreferrer"
          class="ui-hover-text-action"
          >苏ICP备2026010377号</a
        >
        <span class="flex items-center gap-1"
          ><img
            src="{{baseUrl}}images/备案图标.png"
            alt="公安备案图标"
            class="h-4 w-4"
          /><a
            href="https://beian.mps.gov.cn/#/query/webSearch?code=32132202001544"
            target="_blank"
            rel="noopener noreferrer"
            class="ui-hover-text-action"
            >苏公网安备32132202001544号</a
          ></span
        >
      </div>
      <p class="text-xs text-gray-500">
        <a
          href="https://github.com/alam00000/tuhe-pdf"
          target="_blank"
          rel="noopener noreferrer"
          class="ui-hover-text-action"
          >TuHe PDF 开源仓库（GitHub）</a
        >，访问境外平台将适用其隐私规则。
      </p>
      <div id="simple-mode-lang-switcher" class="flex-shrink-0"></div>
    </div>
  </div>
</footer>
